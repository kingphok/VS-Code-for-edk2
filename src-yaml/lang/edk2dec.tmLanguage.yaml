# This is the syntax definition source for EDK2 DEC files
name: EDK2 DEC
scopeName: source.edk2dec
fileTypes:
  - dec

patterns:
  - include: "#comment"
  - include: "#Section"

repository:
  # Component for single-line comments starting with #
  comment:
    patterns:
      - name: comment.line.number-sign.edk2dec
        match: '#.*$'

  # Sections Definition
  Section:
    patterns:
      # 3.4 [Defines] Section
      - name: entity.name.section.edk2dec
        begin: '^[ \t]*(\[)(Defines)(\])'
        end: '(?=^[ \t]*\[)'
        beginCaptures:
          '1': { name: punctuation.definition.section.begin.edk2dec }
          '2': { name: keyword.control.edk2dec }
          '3': { name: punctuation.definition.section.end.edk2dec }
        patterns:
          - include: "#comment"
          - include: "#define_statements"
          - include: "#macro_declaration"
          - include: "#macro_expression"

      # 3.5 [Includes] Sections
      - name: entity.name.section.edk2dec
        begin: '^[ \t]*\[(Includes)\b'
        end: '(?=^[ \t]*\[)'
        beginCaptures:
          '1': { name: keyword.control.edk2dec }
        patterns:
          - include: "#SectionInnerDotRule"
          - include: "#comment"
          - include: "#macro_declaration"
          - include: "#macro_expression"

      # 3.9 [LibraryClasses] Sections
      - name: entity.name.section.edk2dec
        begin: '^[ \t]*\[(LibraryClasses)\b'
        end: '(?=^[ \t]*\[)'
        beginCaptures:
          '1': { name: keyword.control.edk2dec }
        patterns:
          - include: "#SectionInnerDotRule"
          - include: "#comment"
          - include: "#macro_declaration"
          - include: "#macro_expression"
          - include: "#pipe_separator"

      # 3.6 [Guids] / 3.7 [Protocols] / 3.8 [PPIs] Sections
      - name: entity.name.section.edk2dec
        begin: '^[ \t]*\[(Guids|Protocols|Ppis)\b'
        end: '(?=^[ \t]*\[)'
        beginCaptures:
          '1': { name: keyword.control.edk2dec }
        patterns:
          - include: "#SectionInnerDotRule"
          - include: "#comment"
          - include: "#hex_numbers"
          - include: "#guid_protocol_ppi_variable"

      # 3.10 PCD Sections, comment in https://github.com/tianocore/edk2/blob/master/BaseTools/Source/Python/Workspace/MetaFileParser.py
      - name: entity.name.section.edk2dec
        begin: '^[ \t]*\[(PcdsDynamic|PcdsDynamicDefault|PcdsDynamicEx|PcdsDynamicExDefault|PcdsDynamicExHii|PcdsDynamicExVpd|PcdsDynamicHii|PcdsDynamicVpd|PcdsFeatureFlag|PcdsFixedAtBuild|PcdsPatchableInModule)\b'
        end: '(?=^[ \t]*\[)'
        beginCaptures:
          '1': { name: keyword.control.edk2dec }
        patterns:
          - include: "#SectionInnerDotRule"
          - include: "#comment"
          - include: "#macro_expression"
          - include: "#string_expression"
          - include: "#pcd_uint_type"
          - include: "#boolean_expression"
          - include: "#hex_numbers"
          - include: "#decimal_numbers"
          - include: "#pipe_separator"
          - include: "#pcd_variable"

      # 3.11 [UserExtensions] Sections
      - name: entity.name.section.edk2dec
        begin: '^[ \t]*\[(UserExtensions)\b'
        end: '(?=^[ \t]*\[)'
        beginCaptures:
          '1': { name: keyword.control.edk2dec }
        patterns:
          - include: "#SectionInnerDotRule"
          - include: "#comment"

  # Generic Section, parsing from end to begin
  SectionInnerDotRule:
    patterns:
      - begin: '\G'
        end: '(\])'
        endCaptures:
          '1': { name: punctuation.definition.section.end.edk2dec }
        patterns:
          # Generic section name
          - name: keyword.control.edk2dec
            match: '\b(Includes|LibraryClasses|Guids|Protocols|Ppis|PcdsDynamic|PcdsDynamicDefault|PcdsDynamicEx|PcdsDynamicExDefault|PcdsDynamicExHii|PcdsDynamicExVpd|PcdsDynamicHii|PcdsDynamicVpd|PcdsFeatureFlag|PcdsFixedAtBuild|PcdsPatchableInModule|UserExtensions)\b'

          # Error Detection: Match spaces trailing right after a dot character
          - name: invalid.illegal.whitespace.edk2dec
            match: '\.[ \t]+|\.(?=\])'

          # Dot Separator: Match a clean dot without trailing whitespace
          - name: punctuation.separator.dot.edk2dec
            match: '\.' 

          # 5. Comma Separator
          - name: punctuation.separator.comma.edk2dec
            match: ','

          # Architecture Modifiers / Parameters (e.g., IA32, common, X64)
          - name: variable.parameter.edk2dec
            match: '(?<=\.)[a-zA-Z0-9_]+\b'

          # Double-quoted Strings
          - name: string.quoted.double.edk2dec
            match: '"[^"\\]*(?:\\.[^"\\]*)*"'

  # 3.4 [Defines] Section
  define_statements:
    patterns:
      - begin: '^[ \t]*(DEC_SPECIFICATION|PACKAGE_NAME|PACKAGE_GUID|PACKAGE_VERSION|PACKAGE_UNI_FILE)[ \t]*(=)[ \t]*'
        end: '$'
        beginCaptures:
          '1': { name: keyword.control.edk2dec }               # Highlights [Defines] specific parameters
          '2': { name: punctuation.separator.equals.edk2dec }  # Highlights the '=' character
        patterns:
          - include: "#guid_expression"
          - include: "#version_expression"
          - include: "#hex_numbers"
          - include: "#decimal_numbers"

  # 3.2.2 MACRO Statements
  macro_declaration:
    patterns:
      - begin: '^[ \t]*\b(DEFINE)\b[ \t]+([a-zA-Z_][a-zA-Z0-9_]*)[ \t]*(=)[ \t]*'
        end: '$'
        beginCaptures:
          '1': { name: keyword.other.define.edk2dec }        # Highlights 'DEFINE'
          '2': { name: variable.other.macro.edk2dec }        # Highlights macro variable name
          '3': { name: keyword.operator.assignment.edk2dec } # Highlights '='
        patterns:
          - include: "#macro_expression"
          - include: "#string_expression"
          - include: "#boolean_expression"
          - include: "#hex_numbers"
          - include: "#decimal_numbers"

  # GUID, Macros, Strings, Data Types, and Numbers used in PCD and Section declarations
  guid_expression:
    patterns:
      # GUID (Format: 8-4-4-4-12 hex characters)
      - name: constant.numeric.guid.edk2dec
        match: '\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b'

  # Macros / Environment Variables (e.g., $(NAMED_MACRO))
  macro_expression:
    name: string.interpolated.edk2dec
    begin: '(\$\()'
    end: '(\))'
    beginCaptures:
      '1': { name: punctuation.definition.variable.begin.edk2dec }
    endCaptures:
      '1': { name: punctuation.definition.variable.end.edk2dec }
    patterns:
      - name: variable.other.edk2dec
        match: '[a-zA-Z0-9_]+'

  # Double-quoted Strings and C-style wide strings (e.g., L"string")
  string_expression:
    name: string.quoted.double.edk2dec
    begin: '(L)?"' # Matches optional 'L' prefix followed by double quotes
    end: '"'
    beginCaptures:
      '1': { name: storage.type.string.edk2dec } # Highlights the 'L' prefix
      '2': { name: punctuation.definition.string.begin.edk2dec }
    endCaptures:
      '0': { name: punctuation.definition.string.end.edk2dec }

  # 3.10 PCD Sections, PCD unit data type, without UINTN
  pcd_uint_type:
    patterns:
      # Match VOID* safely
      - name: variable.language.edk2dec
        match: '\bVOID\*'
      # Match other unit and boolean types
      - name: variable.language.edk2dec
        match: '\b(UINT8|UINT16|UINT32|UINT64|BOOLEAN)\b'

  # Version Strings (e.g., 1.27, 1.27.1)
  version_expression:
    patterns:
      - name: constant.numeric.version.edk2dec
        match: '\b[0-9]+(\.[0-9]+)+\b'

  boolean_expression:
    patterns:
      # Boolean values (TRUE or FALSE only)
      - name: constant.language.boolean.edk2dec
        match: '\b(TRUE|FALSE)\b'

  # Hexadecimal numbers (Starts with 0x or 0X)
  hex_numbers:
    patterns:
      - name: constant.numeric.hex.edk2dec
        match: '\b0[xX][0-9a-fA-F]+\b'

  # Decimal numbers (Unsigned integers)
  decimal_numbers:
    patterns:
      - name: constant.numeric.decimal.edk2dec
        match: '\b[0-9]+\b'

  # Pipe separator "|"
  pipe_separator:
    patterns:
      - name: keyword.operator.logical.pipe.edk2dec
        match: '\|'
  
  # GUID, Protocol, PPI variable (left side of the equals sign "=")
  guid_protocol_ppi_variable:
    patterns:
      - name: variable.other.guid.edk2dec
        match: '\b[a-zA-Z0-9_]+\b(?=[ \t]*=)'

  # pcd variable (between a dot "." and a pipe symbol "|")
  pcd_variable:
    patterns:
      - name: variable.other.pcd.edk2dec
        match: '(?<=\.)[a-zA-Z0-9_]+\b(?=[ \t]*\|)'
