# This is the syntax definition source for EDK2 DSC files
name: EDK2 DSC
scopeName: source.edk2dsc
fileTypes:
  - dsc
  - dsc.inc

patterns:
  - include: "#comment"
  - include: "#section"

repository:
  # Component for single-line comments starting with #
  comment:
    patterns:
      - name: comment.line.number-sign.edk2dsc
        match: '#.*$'

  # Component for core section headers
  section:
    patterns:
      - name: entity.name.section.edk2dsc
        match: '^\s*\[[a-zA-Z0-9_,\.\| ]+\]'