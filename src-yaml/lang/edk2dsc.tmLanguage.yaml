# This is the syntax definition source for EDK2 DSC files
name: EDK2 DSC
scopeName: source.edk2dsc
fileTypes:
  - dsc
  - dsc.inc

patterns:
  - include: "#Comment"
  - include: "#IncludeStatement"
  - include: "#conditional_statements"
  - include: "#EDK_II_DSC"

repository:
  # Component for single-line comments starting with #
  Comment:
    patterns:
      - name: comment.line.number-sign.edk2dsc
        match: '#.*$'

  # 3.3.4 !include Statements
  IncludeStatement:
    patterns:
      - begin: '^[ \t]*(?i:(!include))[ \t]+'
        end: '$'
        beginCaptures:
          '1': { name: keyword.control.preprocessor.edk2dsc }
        patterns:
          - include: "#Comment"
          - name: meta.preprocessor.string.edk2dsc
            match: '[^#]+'  # Match the path while strictly stopping before any '#' character

  # 3.3.3 Conditional Directive Blocks
  conditional_statements:
    patterns:
      - begin: '^[ \t]*(?i:(!ifdef|!ifndef|!if|!elseif))\b'
        end: '$'
        beginCaptures:
          '1': { name: keyword.control.preprocessor.edk2dsc }
        patterns:
          - include: "#Comment"
          - include: "#MacroDefinition"
          - include: "#string_expression"
          - include: "#boolean_expression"
          - include: "#hex_numbers"
          - include: "#decimal_numbers"
          - include: "#operators_operands"
      - begin: '^[ \t]*(?i:(!else|!endif))\b'
        end: '$'
        beginCaptures:
          '1': { name: keyword.control.preprocessor.edk2dsc }
        patterns:
          - include: "#Comment"

      # 3.3.5 !error Statements
      - begin: '^[ \t]*(?i:(!error))[ \t]+'
        end: '$'
        beginCaptures:
          '1': { name: invalid.illegal.edk2dsc }
        patterns:
          - include: "#Comment"
          - name: string.edk2dsc
            match: '"[^"\\]*(?:\\.[^"\\]*)*"'
          - name: string.edk2dsc
            match: '[^#]+'

  # 3.3 Platform DSC Definition
  EDK_II_DSC:
    patterns:
      # 3.5 [Defines] Section
      - name: entity.name.section.edk2dsc
        begin: '^[ \t]*\[(?i:(Defines))\]'
        end: '(?=^[ \t]*\[)'
        beginCaptures:
          '1': { name: keyword.control.edk2dsc }
        patterns:
          - include: "#Comment"
          - include: "#IncludeStatement"
          - include: "#conditional_statements"
          - include: "#define_statements"
          - include: "#macro_declaration"
          - include: "#MacroDefinition"

      # 3.6 [BuildOptions] Sections
      - name: entity.name.section.edk2dsc
        begin: '^[ \t]*\[(?i:(BuildOptions))\b'
        end: '(?=^[ \t]*\[)'
        beginCaptures:
          '1': { name: keyword.control.edk2dsc }
        patterns:
          - include: "#section_dot_rule"
          - include: "#Comment"
          - include: "#IncludeStatement"
          - include: "#conditional_statements"
          - include: "#MacroDefinition"
          - include: "#compiler_flag"

      # 3.7 [SkuIds] Section
      - name: entity.name.section.edk2dsc
        begin: '^[ \t]*\[(?i:(SkuIds))\]'
        end: '(?=^[ \t]*\[)'
        beginCaptures:
          '1': { name: keyword.control.edk2dsc }
        patterns:
          - include: "#Comment"
          - include: "#IncludeStatement"
          - include: "#conditional_statements"
          - include: "#hex_numbers"
          - include: "#decimal_numbers"

      # 3.8 [LibraryClasses] Sections
      - name: entity.name.section.edk2dsc
        begin: '^[ \t]*\[(?i:(LibraryClasses))\b'
        end: '(?=^[ \t]*\[)'
        beginCaptures:
          '1': { name: keyword.control.edk2dsc }
        patterns:
          - include: "#section_dot_rule"
          - include: "#Comment"
          - include: "#IncludeStatement"
          - include: "#conditional_statements"
          - include: "#MacroDefinition"
          - include: "#macro_declaration"
          - include: "#FieldSeparator"

      # 3.9 PCD Sections
      - name: entity.name.section.edk2dsc
        begin: '^[ \t]*\[(?i:(PcdsFeatureFlag|PcdsFixedAtBuild|PcdsPatchableInModule|PcdsDynamicDefault|PcdsDynamicVpd|PcdsDynamicHii|PcdsDynamicExDefault|PcdsDynamicExVpd|PcdsDynamicExHii))\b'
        end: '(?=^[ \t]*\[)'
        beginCaptures:
          '1': { name: keyword.control.edk2dsc }
        patterns:
          - include: "#section_dot_rule"
          - include: "#Comment"
          - include: "#IncludeStatement"
          - include: "#conditional_statements"
          - include: "#macro_declaration"
          - include: "#MacroDefinition"
          - include: "#string_expression"
          - include: "#pcd_uint_type"
          - include: "#boolean_expression"
          - include: "#hex_numbers"
          - include: "#decimal_numbers"
          - include: "#FieldSeparator"
          - include: "#pcd_variable"

      # 3.10 [Components] Sections
      - name: entity.name.section.edk2dsc
        begin: '^[ \t]*\[(?i:(Components))\b'
        end: '(?=^[ \t]*\[)'
        beginCaptures:
          '1': { name: keyword.control.edk2dsc }
        patterns:
          - include: "#section_dot_rule"
          - include: "#IncludeStatement"
          - include: "#conditional_statements"
          - include: "#Comment"
          - include: "#MacroDefinition"

          # EBNF: <Exec>
          - match: '\b(EXEC)[ \t]*(=)[ \t]*([^\{\s#]+)'
            captures:
              '1': { name: keyword.control.edk2dsc }
              '3': { name: string.edk2dsc }

          # EBNF: <Edk2Struct>
          - begin: '\{'
            end: '\}'
            beginCaptures:
              '0': { name: entity.name.section.encapsulation.edk2dsc }
            endCaptures:
              '0': { name: entity.name.section.encapsulation.edk2dsc }
            patterns:
              - include: "#conditional_statements"
              - include: "#Comment"
              - include: "#MacroDefinition"

              # <Defines>
              - begin: '(<)(Defines)(>)'
                end: '(?=<|\})'
                beginCaptures:
                  '2': { name: keyword.control.edk2dsc }
                patterns:
                  - include: "#Comment"
                  - begin: '^[ \t]*(FILE_GUID)[ \t]*(=)[ \t]*'
                    end: '$'
                    beginCaptures:
                      '1': { name: keyword.control.edk2dsc }
                    patterns:
                      - include: "#RegistryFormatGUID"
                      - include: "#MacroDefinition"
                      - include: "#macro_declaration"
                      - include: "#conditional_statements"

              # <LibraryClasses>
              - begin: '(<)(LibraryClasses)(>)'
                end: '(?=<|\})'
                beginCaptures:
                  '2': { name: keyword.control.edk2dsc }
                patterns:
                  - include: "#Comment"
                  - include: "#IncludeStatement"
                  - include: "#conditional_statements"
                  - include: "#macro_declaration"
                  - include: "#MacroDefinition"

              # <PcdsFeatureFlag>, <PcdsFixedAtBuild>, <PcdsPatchableInModule>
              - begin: '(<)(PcdsFeatureFlag|PcdsFixedAtBuild|PcdsPatchableInModule)(>)'
                end: '(?=<|\})'
                beginCaptures:
                  '2': { name: keyword.control.edk2dsc }
                patterns:
                  - include: "#Comment"
                  - include: "#IncludeStatement"
                  - include: "#conditional_statements"
                  - include: "#macro_declaration"
                  - include: "#MacroDefinition"
                  - include: "#string_expression"
                  - include: "#pcd_uint_type"
                  - include: "#boolean_expression"
                  - include: "#hex_numbers"
                  - include: "#decimal_numbers"
                  - include: "#FieldSeparator"
                  - include: "#pcd_variable"

              # <BuildOptions>
              - begin: '(<)(BuildOptions)(>)'
                end: '(?=<|\})'
                beginCaptures:
                  '2': { name: keyword.control.edk2dsc }
                patterns:
                  - include: "#Comment"
                  - include: "#IncludeStatement"
                  - include: "#conditional_statements"
                  - include: "#macro_declaration"
                  - include: "#MacroDefinition"
                  - include: "#compiler_flag"

      # 3.11 [UserExtensions] Sections
      - name: entity.name.section.edk2dsc
        begin: '^[ \t]*\[(?i:(UserExtensions))\b'
        end: '(?=^[ \t]*\[)'
        beginCaptures:
          '1': { name: keyword.control.edk2dsc }
        patterns:
          - include: "#section_dot_rule"
          - include: "#Comment"
          - include: "#conditional_statements"
          - include: "#MacroDefinition"
          - include: "#string_expression"
          - include: "#boolean_expression"
          - include: "#hex_numbers"
          - include: "#decimal_numbers"
          - include: "#RegistryFormatGUID"

      # 3.12 [DefaultStores] Section
      - name: entity.name.section.edk2dsc
        begin: '^[ \t]*\[(?i:(DefaultStores))\]'
        end: '(?=^[ \t]*\[)'
        beginCaptures:
          '1': { name: keyword.control.edk2dsc }
        patterns:
          - include: "#Comment"
          - include: "#conditional_statements"
          - include: "#hex_numbers"
          - include: "#decimal_numbers"

      # [Libraries] Sections, only for building EDK module
      - name: entity.name.section.edk2dsc
        begin: '^[ \t]*\[(?i:(Libraries))\b'
        end: '(?=^[ \t]*\[)'
        beginCaptures:
          '1': { name: keyword.control.edk2dsc }
        patterns:
          - include: "#section_dot_rule"
          - include: "#Comment"
          - include: "#IncludeStatement"
          - include: "#conditional_statements"
          - include: "#macro_declaration"
          - include: "#MacroDefinition"

  # 2.2.1 Section Entries. Generic Section, except [Defines], parsing from end to begin
  section_dot_rule:
    patterns:
      - begin: '\G'
        end: '\]'
        patterns:
          # Generic section name
          - name: keyword.control.edk2dsc
            match: '(?i:\b(BuildOptions|Libraries|LibraryClasses|PcdsFeatureFlag|PcdsFixedAtBuild|PcdsPatchableInModule|PcdsDynamicDefault|PcdsDynamicVpd|PcdsDynamicHii|PcdsDynamicExDefault|PcdsDynamicExVpd|PcdsDynamicExHii|Components|UserExtensions)\b)'

          # Error Detection: Match spaces trailing right after a dot character
          - name: invalid.illegal.whitespace.edk2dsc
            match: '\.[ \t]+|\.(?=\])'

          # Dot Separator: Match a clean dot without trailing whitespace
          - name: punctuation.separator.dot.edk2dsc
            match: '\.'

          # Comma Separator
          - name: punctuation.separator.comma.edk2dsc
            match: ','

          # $(arch), $(SkuIdentifier) (e.g., IA32, common, X64, Default)
          - name: variable.parameter.edk2dsc
            match: '(?<=[.|])[a-zA-Z0-9_]+\b'

          # Double-quoted Strings
          - name: string.quoted.double.edk2dsc
            match: '"[^"\\]*(?:\\.[^"\\]*)*"'

          - include: "#FieldSeparator"

  # 3.5 [Defines] Section, Table 6 EDK II [Defines] Section Elements
  define_statements:
    patterns:
      - begin: '^[ \t]*(DSC_SPECIFICATION|PLATFORM_GUID|PLATFORM_VERSION|PLATFORM_NAME|SKUID_IDENTIFIER|SUPPORTED_ARCHITECTURES|BUILD_TARGETS|OUTPUT_DIRECTORY|FLASH_DEFINITION|BUILD_NUMBER|FIX_LOAD_TOP_MEMORY_ADDRESS|TIME_STAMP_FILE|RFC_LANGUAGES|ISO_LANGUAGES|VPD_TOOL_GUID|PCD_INFO_GENERATION|PCD_VAR_CHECK_GENERATION|PREBUILD|POSTBUILD)[ \t]*(=)[ \t]*'
        end: '$'
        beginCaptures:
          '1': { name: keyword.control.edk2dsc }               # Highlights [Defines] specific parameters
          '2': { name: punctuation.separator.equals.edk2dsc }  # Highlights the '=' character
        patterns:
          - include: "#RegistryFormatGUID"
          - include: "#version_expression"
          - include: "#hex_numbers"
          - include: "#decimal_numbers"

  # 3.2.2 MACRO Statements
  macro_declaration:
    patterns:
      - begin: '^[ \t]*\b(DEFINE)\b[ \t]+([a-zA-Z_][a-zA-Z0-9_]*)[ \t]*(=)[ \t]*'
        end: '$'
        beginCaptures:
          '1': { name: keyword.other.define.edk2dsc }        # Highlights 'DEFINE'
          '2': { name: variable.other.macro.edk2dsc }        # Highlights macro variable name
          '3': { name: keyword.operator.assignment.edk2dsc } # Highlights '='
        patterns:
          - include: "#MacroDefinition"
          - include: "#string_expression"
          - include: "#boolean_expression"
          - include: "#hex_numbers"
          - include: "#decimal_numbers"
          - include: "#RegistryFormatGUID"

  # GUID (Format: 8-4-4-4-12 hex characters)
  RegistryFormatGUID:
    patterns:
      - name: constant.numeric.guid.edk2dsc
        match: '\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b'

  # Macros / Environment Variables (e.g., $(NAMED_MACRO))
  MacroDefinition:
    name: string.interpolated.edk2dsc
    begin: '(\$\()'
    end: '(\))'
    patterns:
      - name: variable.other.edk2dsc
        match: '[a-zA-Z0-9_]+'

  # Double-quoted Strings and unicode strings (e.g., L"string")
  string_expression:
    name: string.quoted.double.edk2dsc
    begin: '(L)?"' # Matches optional 'L' prefix followed by double quotes
    end: '"'
    beginCaptures:
      '1': { name: storage.type.string.edk2dsc } # Highlights the 'L' prefix

  # 3.10 PCD Sections, PCD unit data type, expect UINTN
  pcd_uint_type:
    patterns:
      # Match VOID* safely
      - name: variable.language.edk2dsc
        match: '\bVOID\*'
      # Match other unit and boolean types
      - name: variable.language.edk2dsc
        match: '\b(UINT8|UINT16|UINT32|UINT64|BOOLEAN)\b'

  # Version Strings (e.g., 1.27, 1.27.1)
  version_expression:
    patterns:
      - name: constant.numeric.version.edk2dsc
        match: '\b[0-9]+(\.[0-9]+)+\b'

  boolean_expression:
    patterns:
      # Boolean values (TRUE or FALSE only)
      - name: constant.language.boolean.edk2dsc
        match: '\b(TRUE|FALSE)\b'

  # Hexadecimal numbers (Starts with 0x or 0X)
  hex_numbers:
    patterns:
      - name: constant.numeric.hex.edk2dsc
        match: '\b0[xX][0-9a-fA-F]+\b'

  # Decimal numbers (Unsigned integers)
  decimal_numbers:
    patterns:
      - name: constant.numeric.decimal.edk2dsc
        match: '\b[0-9]+\b'

  # EBNF: <FieldSeparator> "|"
  FieldSeparator:
    patterns:
      - name: keyword.operator.logical.pipe.edk2dsc
        match: '\|'

  # pcd variable (between a dot "." and a pipe symbol "|")
  pcd_variable:
    patterns:
      - name: variable.other.pcd.edk2dsc
        match: '(?<=\.)[a-zA-Z0-9_]+\b(?=[ \t]*\|)'

  #  BuildOption compiler Define Flags (e.g., -D TEST_IA32_ONLY, /D TEST_IA32_ONLY)
  compiler_flag:
    patterns:
      - name: meta.preprocessor.macro.edk2dsc
        match: '(-D|/D)[ \t]*([a-zA-Z0-9_]+)'
        captures:
          '1': { name: keyword.control.compiler.flag.edk2dsc } # Highlights '-D' or '/D'
          '2': { name: variable.other.macro.edk2dsc }          # Highlights 'TEST_IA32_ONLY'

  # Table 5 Operator Precedence and Supported Operands, https://github.com/tianocore/edk2/blob/master/BaseTools/Source/Python/Common/Expression.py
  operators_operands:
    patterns:
      # Letter operators(case-sensitive)
      - name: keyword.operator.edk2dsc
        match: '(?<=[ \t])(EQ|NE|in|IN|LE|GE|LT|GT|and|AND|or|OR|not|NOT|xor|XOR)(?=[ \t])'

      # Character operators
      - name: keyword.operator.edk2dsc
        match: '==|!=|<=|>=|&&|\|\||<<|>>|\?:|[<>\+\-\*/%&\|!~^]'
