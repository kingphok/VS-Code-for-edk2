# This is the syntax definition source for EDK2 UNI files
name: EDK2 UNI
scopeName: source.edk2uni
fileTypes:
  - uni
  - UNI

patterns:
  - include: "#comment"
  - include: "#langdef_directive"
  - include: "#fontdef_directive"
  - include: "#font_directive"
  - include: "#string_directive"
  - include: "#language_directive"
  - include: "#include_directive"
  - include: "#quoted_string"
  - include: "#constants_and_data"

repository:
  # Component for single-line comments starting with //
  comment:
    name: comment.line.double-slash.edk2uni
    match: //.*$

  # #langdef directive (e.g., #langdef en-US "English")
  langdef_directive:
    patterns:
      - match: (?<![a-zA-Z0-9_])(#langdef)\b[ \t]+([a-zA-Z]{2}(-[a-zA-Z0-9]{1,8})*)
        captures:
          1: { name: keyword.other.define.edk2uni }
          2: { name: variable.other.macro.edk2uni }

  # #fontdef directive (e.g., #fontdef CustomFont "Arial" 12 "bold|italic")
  fontdef_directive:
    patterns:
      - match: (?<![a-zA-Z0-9_])(#fontdef)\b[ \t]+([a-zA-Z0-9_]+)[ \t]+("[^"]+")?[ \t]*([0-9]+)?[ \t]*("[^"]+")?
        captures:
          1: { name: keyword.other.define.edk2uni }
          2: { name: variable.other.macro.edk2uni }
          3: { name: string.quoted.double.font-name.edk2uni }
          4: { name: constant.numeric.decimal.edk2uni }
          5: { name: string.quoted.double.font-style.edk2uni }

  # #font directive (Matches both global standalone line and mid-line font tokens)
  font_directive:
    patterns:
      - match: (?<![a-zA-Z0-9_])(#font(?!def\b))\b[ \t]+([a-zA-Z0-9_]+)
        captures:
          1: { name: keyword.other.define.edk2uni }
          2: { name: variable.other.macro.edk2uni }

  # #string directive (e.g., #string STR_TOKEN)
  string_directive:
    patterns:
      - match: (?<![a-zA-Z0-9_])(#string)\b[ \t]+([a-zA-Z0-9_-]+)
        captures:
          1: { name: keyword.other.define.edk2uni }
          2: { name: variable.other.macro.edk2uni }

  # #language directive (e.g., #language en-US)
  language_directive:
    patterns:
      - match: (?<![a-zA-Z0-9_])(#language)\b[ \t]+([a-zA-Z]{2}(-[a-zA-Z0-9]{1,8})*)
        captures:
          1: { name: keyword.other.define.edk2uni }
          2: { name: variable.other.macro.edk2uni }

  # #include directive (e.g., #include "file.uni")
  include_directive:
    patterns:
      - match: (?<![a-zA-Z0-9_])(#include)\b
        captures:
          1: { name: keyword.other.define.edk2uni }

  # Generic double-quoted string with HII Font Support Escape Characters
  quoted_string:
    name: string.quoted.double.edk2uni
    begin: '"'
    end: '"|$'
    patterns:
      # HII Layout Control Escapes (\narrow, \wide, \br, \nbr)
      - name: constant.character.escape.edk2uni
        match: \\(narrow|wide|br|nbr)

      # Standard EDK2 Escapes (\n, \r, \t, \", \\)
      - name: constant.character.escape.edk2uni
        match: \\(n|r|t|"|\\)

      # Unicode Hex Escape Sequences (\xXXXX)
      - name: constant.character.escape.edk2uni
        match: \\[x][0-9a-fA-F]{4}

      # HII Font Modification Toggle Escapes (\fb, \fd, \fe, \fi, \fs, \fu)
      - name: constant.character.escape.edk2uni
        match: \\f[bdeisu]

      # HII Font Identifier Selection Escapes (e.g., \f!CustomFont!)
      - begin: \\f!
        end: '!'
        beginCaptures:
          0: { name: constant.character.escape.begin.edk2uni }
        endCaptures:
          0: { name: constant.character.escape.end.edk2uni }
        patterns: []

      # HII Font Size Override Escapes (e.g., \fh!16!)
      - begin: \\fh!
        end: '!'
        beginCaptures:
          0: { name: constant.character.escape.begin.edk2uni }
        endCaptures:
          0: { name: constant.character.escape.end.edk2uni }
        patterns: []

  constants_and_data:
    patterns:
      # Decimal numbers (Unsigned integers)
      - name: constant.numeric.decimal.edk2uni
        match: '\b[0-9]+\b'
