# This is the syntax definition source for EDK2 INF files
name: EDK2 INF
scopeName: source.edk2inf
fileTypes:
  - inf

patterns:
  - include: "#comment"
  - include: "#section"

repository:
  # Component for single-line comments starting with #
  comment:
    patterns:
      - name: comment.line.number-sign
        match: '#.*$'

  # Component for core section headers, e.g., [Defines], [Components]
  section:
    patterns:
      - name: entity.name.section.edk2inf
        match: '^\s*\[[a-zA-Z0-9_,\.\| ]+\]'