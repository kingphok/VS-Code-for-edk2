# This is the syntax definition source for EDK2 FDF files
name: EDK2 FDF
scopeName: source.edk2fdf
fileTypes:
  - fdf
  - fdf.inc

patterns:
  - include: "#comment"
  - include: "#section"

repository:
  # Component for single-line comments starting with #
  comment:
    patterns:
      - name: comment.line.number-sign.edk2fdf
        match: '#.*$'

  # Component for core section headers
  section:
    patterns:
      - name: entity.name.section.edk2fdf
        match: '^\s*\[[a-zA-Z0-9_,\.\| ]+\]'